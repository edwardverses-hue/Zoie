<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>our gallery</title>
  <link rel="icon" href="data:," />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Reenie+Beanie&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="bg"></div>

  <!-- endless photo plane: tiles are built by main.js -->
  <div id="stage" aria-label="Photo gallery. Drag to explore.">
    <div id="plane"></div>
  </div>

  <!-- keychain sits in the middle, pinned while the photos move -->
  <div id="keychain" aria-hidden="true"></div>



  <header>
    <a href="#gallery" data-view="gallery">our gallery<svg class="ink" viewBox="0 0 100 40" preserveAspectRatio="none" aria-hidden="true"><path pathLength="1" d="M7 23 C4 9 38 2 68 4.5 C93 7 99 21 85 31 C66 41 24 40.5 9 29.5 C4 25.5 6 18 14 14"/></svg></a>
    <a href="#birthday" data-view="birthday">happy birthday &lt;3<svg class="ink" viewBox="0 0 100 40" preserveAspectRatio="none" aria-hidden="true"><path pathLength="1" d="M90 20 C96 8 62 2.5 34 4 C9 6 1 18 12 29 C26 40 72 41 89 31 C96 26.5 95 19 86 15"/></svg></a>
  </header>

  <div id="headline" aria-hidden="true"></div>

  <p id="hint">drag anywhere</p>

  <!-- map of the whole gallery, after haneda-nice-day: hatched blocks = photos, frame = what's on screen -->
  <div id="minimap" aria-hidden="true">
    <div class="mm-map"></div>
    <div class="mm-frame"></div>
  </div>
  <button id="zoom" type="button" data-zoom="in" aria-label="Zoom out to the whole gallery"></button>

  <div id="viewer" role="dialog" aria-modal="true" aria-label="Photo">
    <figure></figure>
    <button class="vbtn close" type="button">close</button>
    <button class="vbtn prev" type="button" aria-label="Previous">&larr; prev</button>
    <button class="vbtn next" type="button" aria-label="Next">next &rarr;</button>
  </div>

  <script src="photos.js"></script>
  <script src="layout.js"></script>
  <script src="main.js"></script>
  <script src="keychain.js"></script>
  <script src="router.js"></script>
  <script src="viewer.js"></script>
  <p id="bb-hint" aria-live="polite"></p>
  <button id="bb-skip" type="button">skip</button>
  <script src="intro.js"></script>
  <script type="module" src="box.js"></script>
  <script src="cursor.js"></script>
</body>
</html>
